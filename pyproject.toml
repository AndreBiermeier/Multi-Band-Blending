# Package metadata, build requirements, and development-tool settings.
[build-system]
requires = ["scikit-build-core>=0.10,<1", "pybind11>=2.13,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "multiband-blending"
version = "0.1.0"
authors = [{name = "Andre Biermeier"}]
description = "Multi-band image blending with feathering and Dijkstra graph-cut seams."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "build>=1,<2"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.25"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/multiband_blending"]
sdist.include = ["CMakeLists.txt", "src/**", "tests/**", "README.md"]
sdist.exclude = ["build/**", "dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["multiband_blending"]

[tool.coverage.run]
source = ["multiband_blending"]
branch = true
